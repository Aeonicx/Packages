version: '3'
services:
  mycontainer:
    image: thuonghai2711/ubuntu-novnc-pulseaudio:22.04
    container_name: mycontainer
    privileged: true
    shm_size: 1g
    ports:
      - "8080:10000"
    environment:
      - VNC_PASSWD=aeon304
      - PORT=10000
      - AUDIO_PORT=1699
      - WEBSOCKIFY_PORT=6900
      - VNC_PORT=5900
      - SCREEN_WIDTH=1024
      - SCREEN_HEIGHT=768
      - SCREEN_DEPTH=24
    volumes:
      - mydata:/workspaces/82922118
volumes:
  mydata:
